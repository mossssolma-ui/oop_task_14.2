[tool.poetry]
name = "oop"
version = "0.1.0"
description = ""
authors = ["Oleg Matyushenko <mos_olma@mail.ru>"]
readme = "README.md"

package-mode = false

[tool.poetry.dependencies]
python = "^3.13"


[tool.poetry.group.test.dependencies]
pytest = "^9.0.1"
pytest-cov = "^7.0.0"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
black = "^25.11.0"
mypy = "^1.19.0"
isort = "^7.0.0"


[tool.black]
line-length = 119
exclude = '''
/\.git/
'''

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = ["venv",
    "main.py"
    ]

[tool.isort]
line_length = 119
profile = "black"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
